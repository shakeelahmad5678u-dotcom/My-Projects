<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    background:url("back.png") no-repeat center/cover;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(60,40,20,.65);
    z-index:0;
  }

  .wrapper{
    position:relative;
    z-index:1;
    width:100%;
    max-width:550px;
    animation: fadeIn 1s forwards;
    animation-delay:1s;
    opacity:0;
  }

  @keyframes fadeIn{
    to{ opacity:1; }
  }

  .card{
    width:100%;
    padding:30px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
  }

  .card h3{
    color:#6b4f2c;
    font-weight:bold;
    text-align:center;
    margin-bottom:25px;
  }

  .btn-brown{
    background:#6b4f2c;
    color:#fff;
    transition:0.3s;
  }
  .btn-brown:hover{
    background:#5a4123;
    color:#fff;
  }

  .form-control:focus,.form-select:focus{
    border-color:#6b4f2c;
    box-shadow:0 0 0 .2rem rgba(107,79,44,.25);
  }

  .eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#6b4f2c;
  }

  input[type=radio]{ accent-color:#6b4f2c; }

  .custom-select-wrapper{
    position:relative;
    width:100%;
  }
  .custom-select{
    display:block;
    width:100%;
    padding:8px;
    border:1px solid #6b4f2c;
    border-radius:6px;
    background:#fff;
    color:#6b4f2c;
    cursor:pointer;
  }
  .custom-options{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#fff;
    border:1px solid #6b4f2c;
    border-radius:0 0 6px 6px;
    max-height:120px;
    overflow-y:auto;
    display:none;
    z-index:10;
  }
  .custom-option{
    padding:8px;
    cursor:pointer;
    color:#6b4f2c;
  }
  .custom-option:hover,.custom-option.selected{
    background:#6b4f2c;
    color:#fff;
  }

  textarea.form-control{ resize:none; height:60px; }

  /* Responsive spacing */
  .row.g-3 > [class*="col-"]{
    margin-bottom:12px;
  }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="wrapper">
  <div class="card">
    <h3>Create Account</h3>
    <form action="dashboard.html" method="post" enctype="multipart/form-data" onsubmit="return checkPassword()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="col-md-6 position-relative">
          <label class="form-label">Password</label>
          <input type="password" id="pass" name="password" class="form-control" required>
          <i class="fa fa-eye eye" onclick="toggle('pass',this)"></i>
        </div>
        <div class="col-md-6 position-relative">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="cpass" name="confirm" class="form-control" required>
          <i class="fa fa-eye eye" onclick="toggle('cpass',this)"></i>
        </div>
        <div class="col-12">
          <label class="form-label">Gender</label><br>
          <input type="radio" name="gender" value="Male"> Male
          <input type="radio" name="gender" value="Female" class="ms-3"> Female
          <input type="radio" name="gender" value="Other" class="ms-3"> Other
        </div>
        <div class="col-md-6">
          <label class="form-label">Country</label>
          <div class="custom-select-wrapper">
            <div class="custom-select" onclick="toggleOptions()" id="customSelect">Select Country</div>
            <div class="custom-options" id="customOptions">
              <div class="custom-option" onclick="selectOption(this)">Pakistan</div>
              <div class="custom-option" onclick="selectOption(this)">India</div>
              <div class="custom-option" onclick="selectOption(this)">USA</div>
              <div class="custom-option" onclick="selectOption(this)">UK</div>
            </div>
            <input type="hidden" name="country" id="countryInput" required>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Profile Image</label>
          <input type="file" name="image" class="form-control" accept=".jpg,.png" required>
        </div>
        <div class="col-12">
          <label class="form-label">Feedback</label>
          <textarea name="feedback" class="form-control"></textarea>
        </div>
        <div class="col-12 mt-2">
          <button class="btn btn-brown w-100">Register</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  function toggle(id,icon){
    const i=document.getElementById(id);
    if(i.type==='password'){
      i.type='text';
      icon.classList.replace('fa-eye','fa-eye-slash');
    }else{
      i.type='password';
      icon.classList.replace('fa-eye-slash','fa-eye');
    }
  }
  function checkPassword(){
    if(pass.value!==cpass.value){
      alert('Passwords do not match');
      return false;
    }
    return true;
  }

  const customSelect = document.getElementById('customSelect');
  const customOptions = document.getElementById('customOptions');
  const countryInput = document.getElementById('countryInput');

  function toggleOptions(){
    customOptions.style.display = customOptions.style.display==='block' ? 'none' : 'block';
  }
  function selectOption(el){
    customSelect.textContent = el.textContent;
    countryInput.value = el.textContent;
    const allOptions = customOptions.querySelectorAll('.custom-option');
    allOptions.forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    customOptions.style.display='none';
  }
  window.onclick = function(e){
    if(!e.target.closest('.custom-select-wrapper')){
      customOptions.style.display='none';
    }
  }
</script>
</body>
</html>
